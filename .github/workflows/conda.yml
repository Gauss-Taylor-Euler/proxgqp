name: conda

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false
      - name: build
        run: |
          pixi exec rattler-build build \
            --recipe recipe/recipe.yaml \
            --output-dir output \
            -c conda-forge
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: output/**/*.conda

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: output
          merge-multiple: true
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false
      - name: upload
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          pixi exec rattler-build upload prefix \
            --channel proxgqp \
            $(find output -name '*.conda')
